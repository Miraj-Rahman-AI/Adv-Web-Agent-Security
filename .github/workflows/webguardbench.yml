name: WebGuardBench
on:
  push:
    paths: ['WebGuardBench/**', 'ActionShield/**', '.github/workflows/webguardbench.yml']
  pull_request:
    paths: ['WebGuardBench/**', 'ActionShield/**', '.github/workflows/webguardbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: WebGuardBench
    env:
      PYTHONPATH: ${{ github.workspace }}/ActionShield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m "not browser" -q
      - run: python -m webguardbench validate
      - run: python -m webguardbench run --config configs/comparison.yaml --output results/ci
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webguardbench-${{ matrix.os }}-${{ matrix.python }}
          path: WebGuardBench/results/ci

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebGuardBench
    env:
      PYTHONPATH: ${{ github.workspace }}/ActionShield
      WGB_TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m browser -q
